# SPDX-License-Identifier: Apache-2.0
[project]
name = "walletcap"
version = "0.4.0"
description = "Spend limits for AI agent wallets: a per-payment cap and rolling 24-hour budget that holds across restarts, kept in one SQLite ledger that every process, and the npm package, shares."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Coriolis Labs Inc." }]
keywords = [
    "ai-agents",
    "ai-agent",
    "agent-wallet",
    "agent-payments",
    "spending-limit",
    "spend-limit",
    "budget",
    "x402",
    "usdc",
    "stablecoin",
    "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
walletcap = "walletcap.__main__:main"

[project.urls]
Homepage = "https://github.com/coriolislabs/WalletCap"
Repository = "https://github.com/coriolislabs/WalletCap"
Issues = "https://github.com/coriolislabs/WalletCap/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walletcap"]

# The sdist is the Python package alone.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml", "hatch_build.py", "pytest.ini", "README.md", "LICENSE", "NOTICE"]
# The repository's .gitignore stays out; the spec copies tests make under src/ stay out too, and
# hatch_build.py adds the spec from the repository's spec/.
ignore-vcs = true
exclude = ["src/walletcap/spec", "__pycache__", "*.pyc"]

# The ledger's rule ships inside the package: spec/ at the repository root is the one copy, and
# hatch_build.py puts it in both archives.
[tool.hatch.build.hooks.custom]
