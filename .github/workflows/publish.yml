# SPDX-License-Identifier: Apache-2.0
# Publish walletcap to PyPI when a GitHub Release is published, or by hand.
# PyPI trusted publishing matches this repository, the workflow filename
# (publish.yml) and the "pypi" environment; no API token is stored.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run the Python suite
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q
      - name: Build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
