# SPDX-License-Identifier: Apache-2.0
# Publish walletcap to PyPI and npm when a GitHub Release is published, or by hand.
# Both use trusted publishing, so no token is stored. PyPI matches this repository,
# the workflow filename (publish.yml) and the "pypi" environment, and attaches PEP 740
# attestations. npm matches this repository, publish.yml and the "npm" environment,
# and attaches provenance.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
      - name: Run the Python suite
        run: |
          python -m pip install --upgrade pytest
          python -m pytest -q
      - name: Build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install --global npm@11.21.1
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p "require('./js/package.json').version")"
      - name: Run the JavaScript suite
        working-directory: js
        run: |
          npm install --no-audit --no-fund --no-package-lock
          node --test
      - name: Publish to npm with provenance
        working-directory: js
        run: npm publish --provenance
