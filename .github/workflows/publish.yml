# SPDX-License-Identifier: Apache-2.0
# Publish a release. RELEASING.md has the steps, the first release of walletcap-mcp included.
#
# A published GitHub Release, or a run by hand from its tag and naming it, decides what goes out:
# - v<version>: walletcap to PyPI (packages/python) and npm (packages/js). Both carry that version.
# - mcp-v<version>: walletcap-mcp to npm (packages/mcp).
# - crash-test-v<version>: walletcap-crash-test to npm (bench/crash-test).
# The release job resolves the tag to a commit once: that commit must be the one the run started
# from, be on main, and carry the package's version. Every build job checks out that commit, not
# the tag's name, so a tag moved while the run is under way changes nothing. Building, testing and
# packing happen in jobs that can't publish, and each packs and uploads its artifact before it
# runs a test; only the four short publish jobs get an OIDC token (id-token: write), and they
# publish the artifacts the build jobs packed. npm installs run with --ignore-scripts, and the
# wheel's build backend is pinned by hash (packages/python/build-constraints.txt).
#
# Trusted publishing, so no token is stored: PyPI matches this repository, publish.yml and the
# "pypi" environment, and attaches PEP 740 attestations; npm matches this repository, publish.yml
# and the "npm" environment, for each package, and attaches provenance.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish: v<version>, mcp-v<version> or crash-test-v<version>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Read the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          case "$tag" in
            v[0-9]*) kind=walletcap ;;
            mcp-v[0-9]*) kind=mcp ;;
            crash-test-v[0-9]*) kind=crash-test ;;
            *) echo "not a release tag: '$tag'" >&2; exit 1 ;;
          esac
          # The pypi and npm environments allow only the release tags: a run from a branch would
          # build and pack, then be refused at the publish jobs. Stop it here instead.
          if [ "$REF" != "refs/tags/$tag" ]; then
            echo "this run is from $REF: run it from the tag, Run workflow → Use workflow from → $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is this run's commit, is on main and names the package's version
        id: pin
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version() { node -p "require('./$1/package.json').version"; }
          case "$KIND" in
            walletcap)
              test "$TAG" = "v$(version packages/js)"
              test "$TAG" = "v$(python3 -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml', 'rb'))['project']['version'])")"
              ;;
            mcp) test "$TAG" = "mcp-v$(version packages/mcp)" ;;
            crash-test) test "$TAG" = "crash-test-v$(version bench/crash-test)" ;;
          esac
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # --- walletcap: build, test and pack, with no token -------------------------------------------

  build-walletcap:
    name: Build and test walletcap
    needs: release
    if: needs.release.outputs.kind == 'walletcap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      # A named uv and no cache: a release build restores nothing an earlier run saved.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install the workspace from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Packed and uploaded before any test runs, so nothing a test executes can touch what is
      # published. A failed suite still fails this job, and the publish jobs need it.
      - name: Pack the npm tarball, the wheel and the sdist
        run: |
          mkdir -p out/npm out/python
          npm pack -w walletcap --pack-destination out/npm
          (cd packages/python && uv build --build-constraints build-constraints.txt --require-hashes --out-dir ../../out/python)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walletcap-npm
          path: out/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walletcap-python
          path: out/python/*
          if-no-files-found: error
      # The same suites CI runs: the JavaScript one builds walletcap, which the Python suite's
      # cross-language tests run.
      - name: The JavaScript suite
        run: npm test -w walletcap
      - name: The Python suite, on the locked dev group
        working-directory: packages/python
        run: uv run --locked pytest -q

  pypi:
    name: PyPI
    needs: [release, build-walletcap]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: walletcap-python
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: npm
    needs: [release, build-walletcap]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: walletcap-npm
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Publish the tarball to npm with provenance
        run: npm publish ./out/walletcap-*.tgz --provenance --access public

  # --- walletcap-mcp ------------------------------------------------------------------------------

  build-mcp:
    name: Build and test walletcap-mcp
    needs: release
    if: needs.release.outputs.kind == 'mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the workspace from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      # walletcap-mcp compiles against this checkout's walletcap. Packed and uploaded before the
      # suite runs.
      - name: Pack the tarball
        run: |
          npm run build -w walletcap
          mkdir -p out && npm pack -w walletcap-mcp --pack-destination out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walletcap-mcp-npm
          path: out/*.tgz
          if-no-files-found: error
      - name: The suite, on this checkout's walletcap
        run: npm test -w walletcap-mcp

  mcp:
    name: npm (mcp)
    needs: [release, build-mcp]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: walletcap-mcp-npm
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Publish the tarball to npm with provenance
        run: npm publish ./out/walletcap-mcp-*.tgz --provenance --access public

  # --- walletcap-crash-test ---------------------------------------------------------------------

  build-crash-test:
    name: Build and test the crash test
    needs: release
    if: needs.release.outputs.kind == 'crash-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      # Packed and uploaded first: the install below has no lockfile, so nothing it brings in
      # runs before the tarball is out of its reach.
      - name: Pack the tarball
        working-directory: bench/crash-test
        run: mkdir -p ../../out && npm pack --pack-destination ../../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walletcap-crash-test-npm
          path: out/*.tgz
          if-no-files-found: error
      # Outside the workspace, so walletcap comes from npm, as users get it. There is no lockfile
      # there, so this is the one npm install, still without install scripts.
      - name: Run the crash test on the walletcap users get from npm
        run: |
          mkdir "$RUNNER_TEMP/crash-test"
          cp -R bench/crash-test/. "$RUNNER_TEMP/crash-test"
          cd "$RUNNER_TEMP/crash-test"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          node --test

  crash-test:
    name: npm (crash test)
    needs: [release, build-crash-test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: walletcap-crash-test-npm
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Publish the tarball to npm with provenance
        run: npm publish ./out/walletcap-crash-test-*.tgz --provenance --access public
