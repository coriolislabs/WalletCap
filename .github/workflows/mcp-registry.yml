# SPDX-License-Identifier: Apache-2.0
# Publish server.json to the official MCP Registry (registry.modelcontextprotocol.io), by hand.
# Run it once the npm release that server.json names is out: the registry checks that
# walletcap-mcp@<version> on npm carries "mcpName": "io.github.coriolislabs/walletcap".
# GitHub OIDC proves the io.github.coriolislabs namespace, so no token is stored.
# (mcp-publisher's interactive GitHub login can't publish to an organization namespace.)
name: MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check server.json names the npm package's version and mcpName
        run: |
          test "$(jq -r .version packages/mcp/server.json)" = "$(jq -r .version packages/mcp/package.json)"
          test "$(jq -r '.packages[0].version' packages/mcp/server.json)" = "$(jq -r .version packages/mcp/package.json)"
          test "$(jq -r '.packages[0].identifier' packages/mcp/server.json)" = "$(jq -r .name packages/mcp/package.json)"
          test "$(jq -r .name packages/mcp/server.json)" = "$(jq -r .mcpName packages/mcp/package.json)"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download mcp-publisher and verify its Sigstore bundle
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Log in to the registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        working-directory: packages/mcp
        run: ../../mcp-publisher publish
