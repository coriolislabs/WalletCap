# SPDX-License-Identifier: Apache-2.0
# Publish server.json to the official MCP Registry (registry.modelcontextprotocol.io), by hand.
# Run it once the npm release that server.json names is out: the registry checks that
# walletcap-mcp@<version> on npm carries "mcpName": "io.github.coriolislabs/walletcap".
# GitHub OIDC proves the io.github.coriolislabs namespace, so no token is stored.
# (mcp-publisher's interactive GitHub login can't publish to an organization namespace.)
# It runs from main only, and first checks that the npm package server.json names was published
# by this repository's publish.yml: a package someone else put under that name is never listed.
name: MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check server.json names the npm package's version and mcpName
        run: |
          test "$(jq -r .version packages/mcp/server.json)" = "$(jq -r .version packages/mcp/package.json)"
          test "$(jq -r '.packages[0].version' packages/mcp/server.json)" = "$(jq -r .version packages/mcp/package.json)"
          test "$(jq -r '.packages[0].identifier' packages/mcp/server.json)" = "$(jq -r .name packages/mcp/package.json)"
          test "$(jq -r .name packages/mcp/server.json)" = "$(jq -r .mcpName packages/mcp/package.json)"
      - name: The npm package server.json names was published by this repository's publish.yml
        run: |
          set -euo pipefail
          name="$(jq -r .name packages/mcp/package.json)"
          version="$(jq -r .version packages/mcp/package.json)"
          curl --fail --silent --show-error "https://registry.npmjs.org/-/npm/v1/attestations/$name@$version" | jq -e '
            [.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1")
             | .bundle.dsseEnvelope.payload | @base64d | fromjson
             | .predicate.buildDefinition.externalParameters.workflow]
            | any(.repository == "https://github.com/coriolislabs/WalletCap" and .path == ".github/workflows/publish.yml")'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download mcp-publisher and verify its Sigstore bundle
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Log in to the registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        working-directory: packages/mcp
        run: ../../mcp-publisher publish
