name: CI

# One CI system. scripts/ci.sh runs the same steps, in this order, on one machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install the workspace from the lockfile
        run: npm ci --no-audit --no-fund
      - name: The workflows' rules (pinned actions; least-privilege, tag-checked publishing)
        run: node scripts/check-workflows.mjs
      - name: Biome
        run: npx biome check --error-on-warnings
      - name: TypeScript, strict
        run: npm run build
      - name: ruff
        working-directory: packages/python
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
      - name: mypy --strict
        working-directory: packages/python
        run: uv run --locked mypy

  js:
    name: walletcap (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the workspace from the lockfile
        run: npm ci --no-audit --no-fund
      # Each builds first. On Windows the tests that need SIGKILL skip themselves.
      - name: walletcap
        run: npm test -w walletcap
      - name: walletcap-mcp
        run: npm test -w walletcap-mcp

  mcp:
    name: walletcap-mcp
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the workspace from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Build walletcap, which walletcap-mcp imports through its package exports
        run: npm run build -w walletcap
      - name: Build and run the suite
        run: npm test -w walletcap-mcp

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Node runs the tests that put both languages on one budget file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install the workspace and build walletcap
        run: npm ci --no-audit --no-fund && npm run build -w walletcap
      - name: Run the suite on the locked dev group
        working-directory: packages/python
        run: uv run --locked --python ${{ matrix.python }} pytest -q

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.7
      - name: forge test
        working-directory: contracts
        run: forge test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the workspace from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Drive the contract on an EVM, without Foundry
        working-directory: contracts/evm
        run: node check.mjs ..

  pack:
    name: Pack and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install the workspace from the lockfile
        run: npm ci --no-audit --no-fund
      # The npm tarballs in an empty project; the wheel, and a wheel built from the sdist, each in
      # a fresh virtual environment; the sdist holds only the Python package.
      - name: Pack, install and use what would be published
        run: bash scripts/pack-smoke.sh

  race:
    name: JS and Python race, kill -9 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the workspace and build walletcap
        run: npm ci --no-audit --no-fund && npm run build -w walletcap
      # Three JS and three Python payers on one file, SIGKILLed at random for 45 seconds, then
      # the file is checked: integrity, the projection replayed from wc_entry, and every admission
      # recomputed from the entries before it.
      - name: Race
        run: node scripts/race/race.mjs --seconds 45 --python python

  quint:
    name: Quint model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: With the ledger's clock, the cap holds
        working-directory: spec/quint
        run: npx -y @informalsystems/quint@0.33.0 run ledger.qnt --main=ledgerClock --invariant=capHolds --max-steps=24 --max-samples=20000
      - name: With a clock per process, the simulator finds the overspend
        working-directory: spec/quint
        run: |
          if npx -y @informalsystems/quint@0.33.0 run ledger.qnt --main=processClocks --invariant=capHolds --max-steps=24 --max-samples=20000; then
            echo "expected a violation with skewed clocks" >&2
            exit 1
          fi

  crash-test:
    name: Crash test
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # The workspace links walletcap to packages/js, so the crash test runs this checkout's
      # walletcap, never the one on npm (a release's walletcap isn't published until it merges).
      - name: Install the workspace and build walletcap
        run: npm ci --no-audit --no-fund && npm run build -w walletcap
      - name: Check the shipped contracts match their sources
        run: node contracts/build.mjs --check
        working-directory: bench/crash-test
      - name: Run it
        run: node --test
        working-directory: bench/crash-test

  crash-test-agentkit:
    name: Crash test (AgentKit)
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the workspace from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Pack the crash test and this checkout's walletcap
        run: |
          npm pack -w walletcap --pack-destination "$RUNNER_TEMP"
          npm pack -w walletcap-crash-test --pack-destination "$RUNNER_TEMP"
      # As users run it, from the packed tarballs, with AgentKit installed alongside. walletcap is
      # this checkout's: the version the crash test depends on isn't on npm until it is released.
      - name: Run it with Coinbase AgentKit alongside
        run: npx -y -p "$RUNNER_TEMP"/walletcap-crash-test-*.tgz -p "$RUNNER_TEMP"/walletcap-[0-9]*.tgz -p @coinbase/agentkit@0.10.4 walletcap-crash-test --agentkit --json > "$RUNNER_TEMP/agentkit.json"
      - name: Check the AgentKit row
        run: node bench/crash-test/ci/check-agentkit.mjs "$RUNNER_TEMP/agentkit.json"

  agentkit-types:
    name: AgentKit types
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the workspace from the lockfile and build walletcap
        run: npm ci --no-audit --no-fund && npm run build -w walletcap
      # AgentKit 0.10.4 brings about 36 packages, so it is no devDependency. It is installed here,
      # beside the workspace, and the type tests compile the README's recipe against its own types.
      - name: Install Coinbase AgentKit 0.10.4 beside the workspace
        run: npm install --prefix "$RUNNER_TEMP/agentkit" --no-audit --no-fund @coinbase/agentkit@0.10.4
      - name: Compile the README's snippets, AgentKit's recipe included
        working-directory: packages/js
        run: WALLETCAP_AGENTKIT_DIR="$RUNNER_TEMP/agentkit" WALLETCAP_REQUIRE_AGENTKIT=1 node --test test/types.test.mjs
