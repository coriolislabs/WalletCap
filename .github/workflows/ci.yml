name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the test dependencies
        run: npm install --no-audit --no-fund
        working-directory: js
      - name: Run the suite
        run: node --test
        working-directory: js

  python:
    name: Python
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Run the suite
        # Node is on PATH here, so the cross-language tests run rather than skip.
        run: uv run --with pytest --python 3.12 pytest -q

  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the check's dependencies
        run: npm install --no-audit --no-fund
        working-directory: solidity/evm
      - name: Drive the contract on an EVM
        run: node check.mjs ..
        working-directory: solidity/evm

  crash-test:
    name: Crash test
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # One install, so the walletcap the crash test depends on comes from this checkout and is
      # never looked up on npm (a release's walletcap isn't published until the PR merges).
      - name: Install the crash test, on this checkout's walletcap
        run: npm install --no-save --no-audit --no-fund --no-package-lock ../js
        working-directory: crash-test
      - name: Check the shipped contracts match their sources
        run: node contracts/build.mjs --check
        working-directory: crash-test
      - name: Run it
        run: node --test
        working-directory: crash-test

  crash-test-agentkit:
    name: Crash test (AgentKit)
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Pack the crash test and this checkout's walletcap
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          (cd ../js && npm pack --pack-destination "$RUNNER_TEMP")
        working-directory: crash-test
      # As users run it, from the packed tarballs, with AgentKit installed alongside. walletcap is
      # this checkout's: the version the crash test depends on isn't on npm until it is released.
      - name: Run it with Coinbase AgentKit alongside
        run: npx -y -p "$RUNNER_TEMP"/walletcap-crash-test-*.tgz -p "$RUNNER_TEMP"/walletcap-[0-9]*.tgz -p @coinbase/agentkit@0.10.4 walletcap-crash-test --agentkit --json > "$RUNNER_TEMP/agentkit.json"
      - name: Check the AgentKit row
        run: node crash-test/ci/check-agentkit.mjs "$RUNNER_TEMP/agentkit.json"
