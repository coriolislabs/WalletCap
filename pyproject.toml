# SPDX-License-Identifier: Apache-2.0
[project]
name = "walletcap"
version = "0.2.3"
description = "Spend limits for AI agent wallets: a per-payment cap and rolling 24-hour budget that holds across restarts, kept in a SQLite file every process and the npm package share."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Coriolis Labs Inc." }]
keywords = [
    "ai-agents",
    "ai-agent",
    "agent-wallet",
    "agent-payments",
    "spending-limit",
    "spend-limit",
    "budget",
    "x402",
    "usdc",
    "stablecoin",
    "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
walletcap = "walletcap.__main__:main"

[project.urls]
Homepage = "https://github.com/coriolislabs/WalletCap"
Repository = "https://github.com/coriolislabs/WalletCap"
Issues = "https://github.com/coriolislabs/WalletCap/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walletcap"]
