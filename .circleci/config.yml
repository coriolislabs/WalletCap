# CircleCI runs the same gate as scripts/ci.sh, directly from the GitHub repo.
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.18
    steps:
      - checkout
      - run:
          name: JavaScript
          command: |
            cd js
            npm install --no-audit --no-fund --no-package-lock
            node --test
      - run:
          name: Python
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3 python3-venv
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet pytest
            /tmp/venv/bin/python -m pytest -q
      - run:
          name: Solidity
          command: |
            cd solidity/evm
            npm install --no-audit --no-fund --no-package-lock
            node check.mjs ..

workflows:
  ci:
    jobs:
      - test
