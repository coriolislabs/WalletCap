# CircleCI runs the same gate as GitHub Actions' local equivalent: scripts/ci.sh.
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.18
    steps:
      - checkout
      - run:
          name: Python
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3 python3-venv
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet pytest
      - run:
          name: scripts/ci.sh
          command: PATH="/tmp/venv/bin:$PATH" scripts/ci.sh

workflows:
  ci:
    jobs:
      - test
